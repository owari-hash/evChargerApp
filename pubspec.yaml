name: evchargerapp
description: "Eplug EV Application"
publish_to: 'none'
version: 1.0.4+4

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.0
  geolocator: ^13.0.2
  http: ^1.2.0
  flutter_secure_storage: ^9.2.4
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

  # Geist is what the kiosk website sets as its --font-sans, so the app and the
  # site read as one product. Instanced from the upstream variable font at the
  # weights the UI actually uses; Flutter picks the nearest declared weight
  # rather than interpolating a wght axis. Geist has no tugrik sign (U+20AE),
  # so ₮ falls back to the platform face — the website does the same.
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
        - asset: assets/fonts/Geist-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Geist-Black.ttf
          weight: 900
